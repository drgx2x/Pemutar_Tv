<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #121212; 
            color: #fff; 
            margin: 0; 
            padding: 8px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar: List button, Input, Play button */
        .top-bar { 
            display: flex; 
            gap: 6px; 
            align-items: center; 
            margin-bottom: 8px; 
            flex-shrink: 0;
        }

        .playlist-btn { 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #444; 
            padding: 8px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: bold; 
            flex-shrink: 0;
        }
        .playlist-btn:hover { background: #3a3a3a; }

        input { 
            flex-grow: 1; 
            padding: 8px 10px; 
            font-size: 13px; 
            background: #1e1e1e;
            color: #fff;
            border-radius: 6px; 
            border: 1px solid #444; 
            outline: none; 
            box-sizing: border-box; 
        }

        button.play-btn { 
            padding: 8px 14px; 
            font-size: 13px; 
            background: #9146FF; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            flex-shrink: 0;
        }
        button.play-btn:hover { background: #772ce8; }

        /* Player Wrapper: Player di atas, Chat di bawah */
        #player-wrapper { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            flex-grow: 1; 
            min-height: 0;
        }

        #player-box { 
            width: 100%; 
            height: 40vh;
            min-height: 200px;
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 6px; 
            overflow: hidden; 
            flex-shrink: 0; 
        }

        iframe, #twitch-embed { width: 100%; height: 100%; border: none; }

        #chat-box { 
            width: 100%; 
            flex-grow: 1; 
            background: #0e0e0e; 
            border-radius: 6px; 
            overflow: hidden; 
            border: 1px solid #222; 
            display: flex; 
            flex-direction: column; 
            min-height: 120px;
        }
        #chat-box iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background-color: #0e0e0e;
            color-scheme: dark;
        }
        .chat-placeholder { color: #777; font-size: 13px; display: flex; align-items: center; justify-content: center; height: 100%; }

        /* Modal Playlist Styles */
        #playlist-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e1e; width: 90%; max-width: 400px; border-radius: 8px; padding: 15px; text-align: left; border: 1px solid #444; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .playlist-item { padding: 10px; background: #2a2a2a; margin-bottom: 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .playlist-item:hover { background: #3a3a3a; }
        .playlist-title { font-size: 14px; font-weight: bold; }
        .playlist-type { font-size: 11px; background: #9146FF; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="playlist-btn" onclick="openPlaylist()">≡ List</button>
        <input type="text" id="streamInput" placeholder="URL / Channel">
        <button class="play-btn" onclick="detectAndPlay()">Putar</button>
    </div>

    <div id="player-wrapper">
        <div id="player-box">
            <span style="color: #777; font-size: 13px;">Masukkan URL atau Channel</span>
        </div>
        <div id="chat-box">
            <div class="chat-placeholder">Kolom Live Chat / Komentar</div>
        </div>
    </div>

    <!-- Modal Playlist -->
    <div id="playlist-modal" onclick="closePlaylistOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h4 style="margin: 0;">Daftar Playlist</h4>
                <button class="close-btn" onclick="closePlaylist()">✕</button>
            </div>
            <div id="playlist-container">
                <p style="color: #888; text-align: center;">Memuat playlist...</p>
            </div>
        </div>
    </div>

    <!-- Load streams.js directly as a script so myStreams is defined natively without fetch/CORS/parsing issues -->
    <script src="streams.js"></script>
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <script>
        // Otomatis ubah orientasi ke landscape saat masuk mode fullscreen di browser HP
        document.addEventListener("fullscreenchange", function() {
            if (document.fullscreenElement) {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(function(err) {
                        console.log("Screen orientation lock not supported or denied:", err);
                    });
                }
            } else {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        });

        function renderPlaylist() {
            let container = document.getElementById('playlist-container');
            // Check if myStreams is available globally from streams.js
            if (typeof myStreams === 'undefined' || !myStreams || myStreams.length === 0) {
                container.innerHTML = '<p style="color: #ff5555; text-align: center;">Playlist kosong atau streams.js gagal dimuat.</p>';
                return;
            }

            container.innerHTML = "";
            myStreams.forEach(item => {
                let div = document.createElement('div');
                div.className = 'playlist-item';
                div.innerHTML = `
                    <span class="playlist-title">${item.name}</span>
                    <span class="playlist-type">${(item.type || 'stream').toUpperCase()}</span>
                `;
                div.onclick = () => {
                    document.getElementById('streamInput').value = item.url || item.name;
                    detectAndPlay();
                    closePlaylist();
                };
                container.appendChild(div);
            });
        }

        function openPlaylist() {
            document.getElementById('playlist-modal').style.display = 'flex';
            renderPlaylist();
        }

        function closePlaylist() {
            document.getElementById('playlist-modal').style.display = 'none';
        }

        function closePlaylistOutside(event) {
            if (event.target.id === 'playlist-modal') {
                closePlaylist();
            }
        }

        function detectAndPlay() {
            let input = document.getElementById('streamInput').value.trim();
            let playerBox = document.getElementById('player-box');
            let chatBox = document.getElementById('chat-box');
            if (!input) return;

            playerBox.innerHTML = "";
            chatBox.innerHTML = "";

            if (input.includes("youtube.com") || input.includes("youtu.be")) {
                let videoId = "";
                if (input.includes("youtu.be/")) {
                    videoId = input.split("youtu.be/")[1].split("?")[0];
                } else if (input.includes("watch?v=")) {
                    videoId = input.split("watch?v=")[1].split("&")[0];
                } else if (input.includes("embed/")) {
                    videoId = input.split("embed/")[1].split("?")[0];
                }

                if (videoId) {
                    let hostname = window.location.hostname || "localhost";
                    playerBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    chatBox.innerHTML = `<iframe src="https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${hostname}&dark_theme=true"></iframe>`;
                } else {
                    playerBox.innerHTML = `<span style="color: red;">URL YouTube tidak valid</span>`;
                    chatBox.innerHTML = `<div class="chat-placeholder">Chat tidak tersedia</div>`;
                }
            } else {
                let channelName = input;
                if (input.includes("twitch.tv/")) {
                    let parts = input.split("twitch.tv/");
                    channelName = parts[1].split("/")[0];
                }

                let twitchEmbedDiv = document.createElement('div');
                twitchEmbedDiv.id = 'twitch-embed';
                playerBox.appendChild(twitchEmbedDiv);

                // Ambil daftar parent yang aman untuk Twitch
                let parents = ["localhost", "127.0.0.1", "capacitor.localhost", "app.localhost"];
                if (window.location.hostname && !parents.includes(window.location.hostname)) {
                    parents.push(window.location.hostname);
                }

                new Twitch.Embed("twitch-embed", {
                    width: "100%",
                    height: "100%",
                    channel: channelName,
                    layout: "video",
                    parent: parents
                });

                let chatHostname = window.location.hostname && window.location.hostname !== "" ? window.location.hostname : "localhost";
                chatBox.innerHTML = `<iframe src="https://www.twitch.tv/embed/${channelName}/chat?parent=${chatHostname}&parent=localhost&parent=127.0.0.1&parent=capacitor.localhost&darkpopout"></iframe>`;
            }
        }
    </script>
</body>
</html>
