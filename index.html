<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player (Twitch & YouTube)</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 10px; margin: 0; box-sizing: border-box; }
        .container { margin-top: 5px; margin-bottom: 10px; }
        input { width: 70%; padding: 8px 12px; font-size: 14px; border-radius: 5px; border: none; outline: none; box-sizing: border-box; }
        button { padding: 8px 15px; font-size: 14px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .btn-twitch { background: #9146FF; }
        .platform-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        .badge-twitch { background: #9146FF; }
        .badge-youtube { background: #FF0000; }
        #player-container { display: flex; justify-content: center; width: 100%; }
        #player-box { width: 100%; max-width: 650px; height: 85vh; position: relative; display: flex; flex-direction: column; }
        iframe { width: 100%; border: none; border-radius: 8px; }
        .yt-player-wrap { height: 40%; width: 100%; min-height: 200px; }
        .yt-comments-wrap { height: 58%; width: 100%; margin-top: 5px; background: #0f0f0f; border: 1px solid #272727; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; text-align: left; }
        .yt-comments-wrap h4 { margin: 0; padding: 8px 12px; font-size: 12px; color: #aaa; background: #181818; border-bottom: 1px solid #272727; }
        .comment-item { font-size: 12px; margin-bottom: 10px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }
        .comment-author { font-weight: bold; color: #3ea6ff; margin-bottom: 2px; }
        .comment-text { color: #ddd; word-break: break-word; }
    </style>
</head>
<body>

    <div class="container">
        <input type="text" id="streamInput" placeholder="Cth: shroud atau https://youtu.be/..."><br>
        <button class="btn-twitch" onclick="playStream()">Putar Otomatis</button>
    </div>

    <div id="player-container">
        <div id="player-box">
            <p style="color: #666; margin-top: 100px;">Masukkan link atau channel di atas untuk mulai menonton</p>
        </div>
    </div>

    <!-- Twitch Embed SDK -->
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <script>
        function playStream() {
            let input = document.getElementById('streamInput').value.trim();
            if (!input) return;

            let playerBox = document.getElementById('player-box');
            playerBox.innerHTML = '';

            let isYouTube = false;
            let ytId = '';

            if (input.includes('youtube.com') || input.includes('youtu.be')) {
                isYouTube = true;
                ytId = extractYouTubeId(input);
            } else {
                isYouTube = false;
            }

            if (isYouTube && ytId) {
                playerBox.innerHTML = `
                    <div class="platform-badge badge-youtube">YouTube Player & Comments</div>
                    <div class="yt-player-wrap">
                        <iframe id="yt-iframe" src="https://www.youtube.com/embed/${ytId}?autoplay=1&enablejsapi=1" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="yt-comments-wrap" id="yt-comments-box">
                        <h4>Live Chat YouTube</h4>
                        <div style="padding: 10px; color: #888; font-size: 12px;">Memuat live chat...</div>
                    </div>
                `;

                loadYouTubeLiveChat(ytId);
            } else {
                let channelName = input;
                if (input.includes("twitch.tv/")) {
                    let parts = input.split("twitch.tv/");
                    channelName = parts[1].split("/")[0].split("?")[0];
                }
                
                playerbox_height = '85vh';
                playerBox.innerHTML = `
                    <div class="platform-badge badge-twitch">Twitch Player</div>
                    <div id="twitch-embed" style="width:100%; height:calc(100% - 25px);"></div>
                `;

                new Twitch.Embed("twitch-embed", {
                    width: "100%",
                    height: "100%",
                    channel: channelName,
                    layout: "video-with-chat",
                    parent: ["localhost", "127.0.0.1", "capacitor.localhost", "drgx2x.github.io"]
                });
            }
        }

        function extractYouTubeId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadYouTubeLiveChat(videoId) {
            let commentsBox = document.getElementById('yt-comments-box');
            let currentHost = window.location.hostname || "localhost";
            
            // Parameter dark_theme=1 agar chat YouTube bernuansa gelap otomatis sesuai permintaan
            commentsBox.innerHTML = `
                <h4>Live Chat YouTube (Dark Theme)</h4>
                <iframe src="https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${currentHost}&dark_theme=1" style="width:100%; height:100%; border:none; background:#0f0f0f;"></iframe>
            `;
        }

        // Auto lock orientation to landscape on fullscreen
        if (screen.orientation && screen.orientation.lock) {
            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    screen.orientation.lock('landscape').catch(() => {});
                } else {
                    screen.orientation.unlock().catch(() => {});
                }
            });
            
            document.addEventListener('webkitfullscreenchange', () => {
                if (document.webkitFullscreenElement) {
                    screen.orientation.lock('landscape').catch(() => {});
                } else {
                    screen.orientation.unlock().catch(() => {});
                }
            });
        }
    </script>
</body>
</html>
