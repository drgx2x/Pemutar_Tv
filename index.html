<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Android Player</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 15px; margin: 0; }
        .container { margin-top: 10px; }
        input { width: 70%; padding: 10px; font-size: 14px; border-radius: 5px; border: none; outline: none; box-sizing: border-box; }
        button { padding: 10px 15px; font-size: 14px; background: #9146FF; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        #player-container { margin-top: 15px; display: flex; justify-content: center; }
        #twitch-embed { width: 100%; max-width: 500px; height: 450px; }
    </style>
</head>
<body>

    <div class="container">
        <h3>Twitch Stream Player</h3>
        <input type="text" id="channelInput" placeholder="Nama channel (cth: shroud)"><br>
        <button onclick="playStream()">Putar Stream</button>
    </div>

    <div id="player-container">
        <div id="twitch-embed"></div>
    </div>

    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <script>
        let embed;
        function playStream() {
            let input = document.getElementById('channelInput').value.trim();
            if (!input) return;
            let channelName = input;
            if (input.includes("twitch.tv/")) {
                let parts = input.split("twitch.tv/");
                channelName = parts[1].split("/")[0];
            }
            document.getElementById('twitch-embed').innerHTML = "";
            embed = new Twitch.Embed("twitch-embed", {
                width: "100%",
                height: "450",
                channel: channelName,
                layout: "video-with-chat",
                parent: ["localhost", "127.0.0.1", "capacitor.localhost", "drgx2x.github.io"]
            });

            // Auto lock orientation to landscape on fullscreen if supported (Android/Mobile)
            if (screen.orientation && screen.orientation.lock) {
                let playerEl = document.getElementById('twitch-embed');
                
                document.addEventListener('fullscreenchange', () => {
                    if (document.fullscreenElement) {
                        screen.orientation.lock('landscape').catch(() => {});
                    } else {
                        screen.orientation.unlock().catch(() => {});
                    }
                });
                
                document.addEventListener('webkitfullscreenchange', () => {
                    if (document.webkitFullscreenElement) {
                        screen.orientation.lock('landscape').catch(() => {});
                    } else {
                        screen.orientation.unlock().catch(() => {});
                    }
                });
            }
        }
    </script>
</body>
</html>
