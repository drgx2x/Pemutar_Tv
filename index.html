<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #121212; 
            color: #fff; 
            margin: 0; 
            padding: 8px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar: List button, Input, Play button */
        .top-bar { 
            display: flex; 
            gap: 6px; 
            align-items: center; 
            margin-bottom: 8px; 
            flex-shrink: 0;
        }

        .playlist-btn { 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #444; 
            padding: 8px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: bold; 
            flex-shrink: 0;
        }
        .playlist-btn:hover { background: #3a3a3a; }

        .sleep-btn { 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #444; 
            padding: 8px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: bold; 
            flex-shrink: 0;
        }
        .sleep-btn:hover { background: #3a3a3a; }
        .sleep-btn.active { background: #d9534f; border-color: #d9534f; }

        input { 
            flex-grow: 1; 
            padding: 8px 10px; 
            font-size: 13px; 
            background: #1e1e1e;
            color: #fff;
            border-radius: 6px; 
            border: 1px solid #444; 
            outline: none; 
            box-sizing: border-box; 
        }

        button.play-btn { 
            padding: 8px 14px; 
            font-size: 13px; 
            background: #9146FF; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            flex-shrink: 0;
        }
        button.play-btn:hover { background: #772ce8; }

        /* Player Wrapper: Player di atas, Chat di bawah */
        #player-wrapper { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            flex-grow: 1; 
            min-height: 0;
        }

        #player-box { 
            width: 100%; 
            height: 40vh;
            min-height: 200px;
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 6px; 
            overflow: hidden; 
            flex-shrink: 0; 
        }

        iframe, #twitch-embed { width: 100%; height: 100%; border: none; }

        #chat-box { 
            width: 100%; 
            flex-grow: 1; 
            background: #0e0e0e; 
            border-radius: 6px; 
            overflow: hidden; 
            border: 1px solid #222; 
            display: flex; 
            flex-direction: column; 
            min-height: 120px;
        }
        #chat-box iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background-color: #0e0e0e;
            color-scheme: dark;
        }
        .chat-placeholder { color: #777; font-size: 13px; display: flex; align-items: center; justify-content: center; height: 100%; }

        /* Modal Playlist Styles */
        #playlist-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e1e; width: 90%; max-width: 400px; border-radius: 8px; padding: 15px; text-align: left; border: 1px solid #444; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .playlist-item { padding: 10px; background: #2a2a2a; margin-bottom: 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .playlist-item:hover { background: #3a3a3a; }
        .playlist-title { font-size: 14px; font-weight: bold; }
        .playlist-type { font-size: 11px; background: #9146FF; padding: 2px 6px; border-radius: 3px; }

        /* Dropdown Menu untuk Aksi Playlist */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropbtn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 4px 8px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .dropbtn:hover { background: #444; }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #252525;
            min-width: 120px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
            z-index: 1020;
            border-radius: 6px;
            border: 1px solid #444;
            overflow: hidden;
        }
        .dropdown-content button {
            color: #fff;
            padding: 8px 12px;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }
        .dropdown-content button:hover { background-color: #333; }
        .dropdown-content button.danger { color: #ff6b6b; }
        .dropdown-content button.danger:hover { background-color: #4a2525; }
        .dropdown.show .dropdown-content { display: block; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="playlist-btn" onclick="openPlaylist()">≡ List</button>
        <button class="sleep-btn" id="sleepBtn" onclick="openSleepModal()">💤</button>
        <input type="text" id="streamInput" placeholder="URL / Channel">
        <button class="play-btn" onclick="detectAndPlay()">Putar</button>
    </div>

    <div id="player-wrapper">
        <div id="player-box">
            <span style="color: #777; font-size: 13px;">Masukkan URL atau Channel</span>
        </div>
        <div id="chat-box">
            <div class="chat-placeholder">Kolom Live Chat / Komentar</div>
        </div>
    </div>

    <!-- Modal Playlist -->
    <div id="playlist-modal" onclick="closePlaylistOutside(event)">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h4 style="margin: 0;">Daftar Playlist</h4>
                <button class="close-btn" onclick="closePlaylist()">✕</button>
            </div>
            <div style="margin-bottom: 12px; display: flex; justify-content: flex-end;">
                <button onclick="openAddPlaylistModal()" style="background: #9146FF; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold;">+ Tambah Playlist</button>
            </div>
            <div id="playlist-container" style="max-height: 60vh; overflow-y: auto;">
                <p style="color: #888; text-align: center;">Memuat playlist...</p>
            </div>
        </div>
    </div>

    <!-- Sub-Modal Add/Edit Playlist -->
    <div id="playlist-form-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1050; align-items: center; justify-content: center;">
        <div class="modal-content" style="max-width: 350px;">
            <div class="modal-header">
                <h4 id="playlist-form-title" style="margin: 0;">Tambah Playlist</h4>
                <button class="close-btn" onclick="closePlaylistFormModal()">✕</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px; padding: 5px 0;">
                <div>
                    <label style="font-size: 11px; color: #aaa; display: block; margin-bottom: 4px;">Nama Channel / Acara</label>
                    <input type="text" id="plEditName" placeholder="Contoh: Kompas TV" style="width: 100%; box-sizing: border-box;">
                </div>
                <div>
                    <label style="font-size: 11px; color: #aaa; display: block; margin-bottom: 4px;">URL atau Nama Channel</label>
                    <input type="text" id="plEditUrl" placeholder="https://youtube.com/... atau channel" style="width: 100%; box-sizing: border-box;">
                </div>
                <div>
                    <label style="font-size: 11px; color: #aaa; display: block; margin-bottom: 4px;">Tipe</label>
                    <select id="plEditType" style="width: 100%; padding: 8px 10px; font-size: 13px; background: #1e1e1e; color: #fff; border-radius: 6px; border: 1px solid #444; outline: none; box-sizing: border-box;">
                        <option value="youtube">YouTube</option>
                        <option value="twitch">Twitch</option>
                    </select>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 10px;">
                    <button onclick="savePlaylistEntry()" style="flex: 1; background: #9146FF; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold;">Simpan</button>
                    <button onclick="closePlaylistFormModal()" style="background: #444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer;">Batal</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Sleep Timer -->
    <div id="sleep-modal" onclick="closeSleepOutside(event)" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content">
            <div class="modal-header">
                <h4 style="margin: 0;">Sleep Timer</h4>
                <button class="close-btn" onclick="closeSleepModal()">✕</button>
            </div>
            <div style="padding: 10px 0;">
                <p id="sleep-status" style="font-size: 13px; color: #aaa; margin-top: 0; margin-bottom: 12px; text-align: center;">Timer tidak aktif</p>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px;">
                    <button onclick="setSleepTimer(15)" style="padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-weight: bold;">15m</button>
                    <button onclick="setSleepTimer(30)" style="padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-weight: bold;">30m</button>
                    <button onclick="setSleepTimer(45)" style="padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-weight: bold;">45m</button>
                    <button onclick="setSleepTimer(60)" style="padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-weight: bold;">60m</button>
                </div>
                <!-- Input Manual -->
                <div style="display: flex; gap: 6px; margin-bottom: 12px;">
                    <input type="number" id="manualMinutesInput" placeholder="Menit manual" min="1" style="flex-grow: 1; padding: 8px 10px; font-size: 13px; background: #1e1e1e; color: #fff; border-radius: 6px; border: 1px solid #444; outline: none;">
                    <button onclick="setCustomSleepTimer()" style="padding: 8px 14px; background: #9146FF; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; flex-shrink: 0;">Set</button>
                </div>
                <button onclick="cancelSleepTimer()" style="width: 100%; padding: 10px; background: #d9534f; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Matikan Timer</button>
            </div>
        </div>
    </div>

    <script src="streams.js"></script>
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <script>
        document.addEventListener("fullscreenchange", function() {
            if (document.fullscreenElement) {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(function(err) {
                        console.log("Screen orientation lock not supported or denied:", err);
                    });
                }
            } else {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        });

        // Tutup dropdown jika klik di luar
        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                let dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.parentElement.classList.contains('show')) {
                        openDropdown.parentElement.classList.remove('show');
                    }
                }
            }
        }

        function renderPlaylist() {
            let container = document.getElementById('playlist-container');
            if (typeof myStreams === 'undefined' || !myStreams || myStreams.length === 0) {
                container.innerHTML = '<p style="color: #ff5555; text-align: center;">Playlist kosong atau streams.js gagal dimuat.</p>';
                return;
            }

            container.innerHTML = "";
            myStreams.forEach((item, index) => {
                let div = document.createElement('div');
                div.className = 'playlist-item';
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.alignItems = 'center';
                div.style.padding = '8px 10px';
                div.style.background = '#2a2a2a';
                div.style.marginBottom = '6px';
                div.style.borderRadius = '5px';

                let infoDiv = document.createElement('div');
                infoDiv.style.flex = '1';
                infoDiv.style.cursor = 'pointer';
                infoDiv.innerHTML = `
                    <div style="font-size: 14px; font-weight: bold; color: #fff;">${item.name}</div>
                    <div style="font-size: 11px; color: #aaa; margin-top: 2px;">${item.url || ''} <span style="background: #9146FF; color: white; padding: 1px 4px; border-radius: 3px; font-size: 9px; margin-left: 4px;">${(item.type || 'stream').toUpperCase()}</span></div>
                `;
                infoDiv.onclick = () => {
                    document.getElementById('streamInput').value = item.url || item.name;
                    detectAndPlay();
                    closePlaylist();
                };

                // Wrapper Dropdown Tunggal (1 Tombol Menu)
                let dropdownDiv = document.createElement('div');
                dropdownDiv.className = 'dropdown';

                let dropBtn = document.createElement('button');
                dropBtn.className = 'dropbtn';
                dropBtn.innerHTML = '⋮';
                dropBtn.title = 'Menu Aksi';
                dropBtn.onclick = (e) => {
                    e.stopPropagation();
                    // Tutup dropdown lain terlebih dahulu
                    let allDropdowns = document.getElementsByClassName('dropdown');
                    for (let d of allDropdowns) {
                        if (d !== dropdownDiv) d.classList.remove('show');
                    }
                    dropdownDiv.classList.toggle('show');
                };

                let dropdownContent = document.createElement('div');
                dropdownContent.className = 'dropdown-content';

                // Pindah Atas
                let upBtn = document.createElement('button');
                upBtn.innerHTML = '▲ Pindah Atas';
                upBtn.disabled = index === 0;
                if (index === 0) upBtn.style.opacity = '0.3';
                upBtn.onclick = (e) => { e.stopPropagation(); movePlaylist(index, -1); };

                // Pindah Bawah
                let downBtn = document.createElement('button');
                downBtn.innerHTML = '▼ Pindah Bawah';
                downBtn.disabled = index === myStreams.length - 1;
                if (index === myStreams.length - 1) downBtn.style.opacity = '0.3';
                downBtn.onclick = (e) => { e.stopPropagation(); movePlaylist(index, 1); };

                // Edit
                let editBtn = document.createElement('button');
                editBtn.innerHTML = '✎ Edit';
                editBtn.onclick = (e) => { e.stopPropagation(); openEditPlaylistModal(index); };

                // Hapus
                let delBtn = document.createElement('button');
                delBtn.className = 'danger';
                delBtn.innerHTML = '✕ Hapus';
                delBtn.onclick = (e) => { e.stopPropagation(); deletePlaylist(index); };

                dropdownContent.appendChild(upBtn);
                dropdownContent.appendChild(downBtn);
                dropdownContent.appendChild(editBtn);
                dropdownContent.appendChild(delBtn);

                dropdownDiv.appendChild(dropBtn);
                dropdownDiv.appendChild(dropdownContent);

                div.appendChild(infoDiv);
                div.appendChild(dropdownDiv);
                container.appendChild(div);
            });
        }

        let editingPlaylistIndex = null;

        function openAddPlaylistModal() {
            editingPlaylistIndex = null;
            document.getElementById('playlist-form-title').innerText = 'Tambah Playlist';
            document.getElementById('plEditName').value = '';
            document.getElementById('plEditUrl').value = '';
            document.getElementById('plEditType').value = 'youtube';
            document.getElementById('playlist-form-modal').style.display = 'flex';
        }

        function openEditPlaylistModal(index) {
            editingPlaylistIndex = index;
            let item = myStreams[index];
            document.getElementById('playlist-form-title').innerText = 'Edit Playlist';
            document.getElementById('plEditName').value = item.name || '';
            document.getElementById('plEditUrl').value = item.url || '';
            document.getElementById('plEditType').value = item.type || 'youtube';
            document.getElementById('playlist-form-modal').style.display = 'flex';
        }

        function closePlaylistFormModal() {
            document.getElementById('playlist-form-modal').style.display = 'none';
        }

        function savePlaylistEntry() {
            let name = document.getElementById('plEditName').value.trim();
            let url = document.getElementById('plEditUrl').value.trim();
            let type = document.getElementById('plEditType').value;

            if (!name || !url) {
                alert('Nama dan URL/Channel wajib diisi!');
                return;
            }

            if (editingPlaylistIndex === null) {
                myStreams.push({ name, url, type });
            } else {
                myStreams[editingPlaylistIndex] = { name, url, type };
            }

            closePlaylistFormModal();
            renderPlaylist();
        }

        function deletePlaylist(index) {
            if (confirm(`Hapus "${myStreams[index].name}" dari playlist?`)) {
                myStreams.splice(index, 1);
                renderPlaylist();
            }
        }

        function movePlaylist(index, direction) {
            let newIndex = index + direction;
            if (newIndex < 0 || newIndex >= myStreams.length) return;
            let temp = myStreams[index];
            myStreams[index] = myStreams[newIndex];
            myStreams[newIndex] = temp;
            renderPlaylist();
        }

        function openPlaylist() {
            document.getElementById('playlist-modal').style.display = 'flex';
            renderPlaylist();
        }

        function closePlaylist() {
            document.getElementById('playlist-modal').style.display = 'none';
        }

        function closePlaylistOutside(event) {
            if (event.target.id === 'playlist-modal') {
                closePlaylist();
            }
        }

        function detectAndPlay() {
            let input = document.getElementById('streamInput').value.trim();
            let playerBox = document.getElementById('player-box');
            let chatBox = document.getElementById('chat-box');
            if (!input) return;

            playerBox.innerHTML = "";
            chatBox.innerHTML = "";

            if (input.includes("youtube.com") || input.includes("youtu.be")) {
                let videoId = "";
                if (input.includes("youtu.be/")) {
                    videoId = input.split("youtu.be/")[1].split("?")[0];
                } else if (input.includes("watch?v=")) {
                    videoId = input.split("watch?v=")[1].split("&")[0];
                } else if (input.includes("embed/")) {
                    videoId = input.split("embed/")[1].split("?")[0];
                }

                if (videoId) {
                    let hostname = window.location.hostname || "localhost";
                    playerBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    chatBox.innerHTML = `<iframe src="https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${hostname}&dark_theme=true"></iframe>`;
                } else {
                    playerBox.innerHTML = `<span style="color: red;">URL YouTube tidak valid</span>`;
                    chatBox.innerHTML = `<div class="chat-placeholder">Chat tidak tersedia</div>`;
                }
            } else {
                let channelName = input;
                if (input.includes("twitch.tv/")) {
                    let parts = input.split("twitch.tv/");
                    channelName = parts[1].split("/")[0];
                }

                let twitchEmbedDiv = document.createElement('div');
                twitchEmbedDiv.id = 'twitch-embed';
                playerBox.appendChild(twitchEmbedDiv);

                let parents = ["localhost", "127.0.0.1", "capacitor.localhost", "app.localhost"];
                if (window.location.hostname && !parents.includes(window.location.hostname)) {
                    parents.push(window.location.hostname);
                }

                new Twitch.Embed("twitch-embed", {
                    width: "100%",
                    height: "100%",
                    channel: channelName,
                    layout: "video",
                    parent: parents
                });

                let chatHostname = window.location.hostname && window.location.hostname !== "" ? window.location.hostname : "localhost";
                chatBox.innerHTML = `<iframe src="https://www.twitch.tv/embed/${channelName}/chat?parent=${chatHostname}&parent=localhost&parent=127.0.0.1&parent=capacitor.localhost&darkpopout"></iframe>`;
            }
        }

        // --- Sleep Timer Logic ---
        let sleepCountdownId = null;
        let sleepTimeRemaining = 0;

        function openSleepModal() {
            document.getElementById('sleep-modal').style.display = 'flex';
            updateSleepStatusUI();
        }

        function closeSleepModal() {
            document.getElementById('sleep-modal').style.display = 'none';
        }

        function closeSleepOutside(event) {
            if (event.target.id === 'sleep-modal') {
                closeSleepModal();
            }
        }

        function setSleepTimer(minutes) {
            cancelSleepTimer();
            sleepTimeRemaining = minutes * 60;
            
            let btn = document.getElementById('sleepBtn');
            btn.classList.add('active');

            sleepCountdownId = setInterval(() => {
                sleepTimeRemaining--;
                updateSleepStatusUI();
                if (sleepTimeRemaining <= 0) {
                    triggerSleep();
                }
            }, 1000);

            updateSleepStatusUI();
            closeSleepModal();
        }

        function setCustomSleepTimer() {
            let inputVal = document.getElementById('manualMinutesInput').value;
            let minutes = parseInt(inputVal);
            if (isNaN(minutes) || minutes <= 0) {
                alert("Masukkan jumlah menit yang valid!");
                return;
            }
            setSleepTimer(minutes);
            document.getElementById('manualMinutesInput').value = "";
        }

        function cancelSleepTimer() {
            if (sleepCountdownId) {
                clearInterval(sleepCountdownId);
                sleepCountdownId = null;
            }
            sleepTimeRemaining = 0;
            let btn = document.getElementById('sleepBtn');
            btn.classList.remove('active');
            updateSleepStatusUI();
        }

        function updateSleepStatusUI() {
            let statusEl = document.getElementById('sleep-status');
            if (!statusEl) return;

            if (sleepTimeRemaining > 0) {
                let m = Math.floor(sleepTimeRemaining / 60);
                let s = sleepTimeRemaining % 60;
                statusEl.innerText = `Timer aktif: Sisa waktu ${m}m ${s < 10 ? '0' : ''}${s}s`;
                statusEl.style.color = '#4ea8de';
            } else {
                statusEl.innerText = "Timer tidak aktif";
                statusEl.style.color = '#aaa';
            }
        }

        function triggerSleep() {
            cancelSleepTimer();
            let playerBox = document.getElementById('player-box');
            let chatBox = document.getElementById('chat-box');
            
            playerBox.innerHTML = `<span style="color: #777; font-size: 13px;">Stream dihentikan oleh Sleep Timer</span>`;
            chatBox.innerHTML = `<div class="chat-placeholder">Sleep Timer Berakhir</div>`;
            
            closeSleepModal();
        }
    </script>
</body>
</html>
