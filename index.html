<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream & Video Player</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 10px; margin: 0; box-sizing: border-box; }
        .top-bar { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 8px; }
        .playlist-btn { background: #333; color: white; border: 1px solid #555; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .playlist-btn:hover { background: #444; }
        .container { margin-bottom: 8px; }
        input { width: 70%; padding: 10px; font-size: 14px; border-radius: 5px; border: none; outline: none; box-sizing: border-box; }
        button.play-btn { padding: 10px 15px; font-size: 14px; background: #9146FF; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        
        #player-wrapper { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        #player-box { width: 100%; max-width: 500px; height: 260px; background: #000; display: flex; align-items: center; justify-content: center; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
        iframe, #twitch-embed { width: 100%; height: 100%; border: none; }

        #chat-box { width: 100%; max-width: 500px; height: 350px; background: #1e1e1e; border-radius: 8px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; }
        #chat-box iframe { width: 100%; height: 100%; border: none; }
        .chat-placeholder { color: #777; font-size: 13px; display: flex; align-items: center; justify-content: center; height: 100%; }

        /* Modal Playlist Styles */
        #playlist-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e1e; width: 90%; max-width: 400px; border-radius: 8px; padding: 15px; text-align: left; border: 1px solid #444; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .playlist-item { padding: 10px; background: #2a2a2a; margin-bottom: 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .playlist-item:hover { background: #3a3a3a; }
        .playlist-title { font-size: 14px; font-weight: bold; }
        .playlist-type { font-size: 11px; background: #9146FF; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="playlist-btn" onclick="openPlaylist()">📁 Playlist</button>
    </div>

    <div class="container">
        <h3>Universal Stream & Video Player</h3>
        <input type="text" id="streamInput" placeholder="Masukkan URL / Nama Channel (Twitch / YouTube)"><br>
        <button class="play-btn" onclick="detectAndPlay()">Putar Media</button>
    </div>

    <div id="player-wrapper">
        <div id="player-box">
            <span style="color: #777; font-size: 13px;">Masukkan URL atau Channel</span>
        </div>
        <div id="chat-box">
            <div class="chat-placeholder">Kolom Live Chat / Komentar</div>
        </div>
    </div>

    <!-- Modal Playlist -->
    <div id="playlist-modal" onclick="closePlaylistOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h4 style="margin: 0;">Daftar Playlist</h4>
                <button class="close-btn" onclick="closePlaylist()">✕</button>
            </div>
            <div id="playlist-container">
                <p style="color: #888; text-align: center;">Memuat playlist...</p>
            </div>
        </div>
    </div>

    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <script>
        let playlistData = [];

        // Ambil data playlist otomatis dari stream.js di GitHub / root folder
        async function fetchPlaylist() {
            try {
                // Mengambil file streams.js langsung dari GitHub Raw atau file lokal streams.js
                let response = await fetch('./streams.js');
                let text = await response.text();
                
                // Parsing variabel `const myStreams = [...]` dari file streams.js
                let cleanText = text.substring(text.indexOf('['), text.lastIndexOf(']') + 1);
                playlistData = JSON.parse(cleanText);
                renderPlaylist();
            } catch (e) {
                console.error("Gagal memuat streams.js:", e);
                document.getElementById('playlist-container').innerHTML = '<p style="color: #ff5555; text-align: center;">Gagal memuat streams.js.</p>';
            }
        }

        function renderPlaylist() {
            let container = document.getElementById('playlist-container');
            if (!playlistData || playlistData.length === 0) {
                container.innerHTML = '<p style="color: #888; text-align: center;">Playlist kosong.</p>';
                return;
            }

            container.innerHTML = "";
            playlistData.forEach(item => {
                let div = document.createElement('div');
                div.className = 'playlist-item';
                div.innerHTML = `
                    <span class="playlist-title">${item.name}</span>
                    <span class="playlist-type">${item.type.toUpperCase()}</span>
                `;
                div.onclick = () => {
                    document.getElementById('streamInput').value = item.url || item.name;
                    detectAndPlay();
                    closePlaylist();
                };
                container.appendChild(div);
            });
        }

        function openPlaylist() {
            document.getElementById('playlist-modal').style.display = 'flex';
            fetchPlaylist(); // Auto refresh setiap kali dibuka agar selalu sinkron dengan GitHub
        }

        function closePlaylist() {
            document.getElementById('playlist-modal').style.display = 'none';
        }

        function closePlaylistOutside(event) {
            if (event.target.id === 'playlist-modal') {
                closePlaylist();
            }
        }

        function detectAndPlay() {
            let input = document.getElementById('streamInput').value.trim();
            let playerBox = document.getElementById('player-box');
            let chatBox = document.getElementById('chat-box');
            if (!input) return;

            playerBox.innerHTML = "";
            chatBox.innerHTML = "";

            if (input.includes("youtube.com") || input.includes("youtu.be")) {
                let videoId = "";
                if (input.includes("youtu.be/")) {
                    videoId = input.split("youtu.be/")[1].split("?")[0];
                } else if (input.includes("watch?v=")) {
                    videoId = input.split("watch?v=")[1].split("&")[0];
                } else if (input.includes("embed/")) {
                    videoId = input.split("embed/")[1].split("?")[0];
                }

                if (videoId) {
                    let hostname = window.location.hostname || "localhost";
                    playerBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    chatBox.innerHTML = `<iframe src="https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${hostname}"></iframe>`;
                } else {
                    playerBox.innerHTML = `<span style="color: red;">URL YouTube tidak valid</span>`;
                    chatBox.innerHTML = `<div class="chat-placeholder">Chat tidak tersedia</div>`;
                }
            } else {
                let channelName = input;
                if (input.includes("twitch.tv/")) {
                    let parts = input.split("twitch.tv/");
                    channelName = parts[1].split("/")[0];
                }

                let twitchEmbedDiv = document.createElement('div');
                twitchEmbedDiv.id = 'twitch-embed';
                playerBox.appendChild(twitchEmbedDiv);

                new Twitch.Embed("twitch-embed", {
                    width: "100%",
                    height: "100%",
                    channel: channelName,
                    parent: ["localhost", "127.0.0.1", "capacitor.localhost", window.location.hostname]
                });

                let hostname = window.location.hostname || "localhost";
                chatBox.innerHTML = `<iframe src="https://www.twitch.tv/embed/${channelName}/chat?parent=${hostname}&parent=localhost&parent=127.0.0.1"></iframe>`;
            }
        }
    </script>
</body>
</html>
