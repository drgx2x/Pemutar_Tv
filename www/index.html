<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #121212; 
            color: #fff; 
            margin: 0; 
            padding: 8px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar: List button, Input, Play button */
        .top-bar { 
            display: flex; 
            gap: 6px; 
            align-items: center; 
            margin-bottom: 8px; 
            flex-shrink: 0;
        }

        .playlist-btn { 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #444; 
            padding: 8px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: bold; 
            flex-shrink: 0;
        }
        .playlist-btn:hover { background: #3a3a3a; }

        input { 
            flex-grow: 1; 
            padding: 8px 10px; 
            font-size: 13px; 
            background: #1e1e1e;
            color: #fff;
            border-radius: 6px; 
            border: 1px solid #444; 
            outline: none; 
            box-sizing: border-box; 
        }

        button.play-btn { 
            padding: 8px 14px; 
            font-size: 13px; 
            background: #9146FF; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            flex-shrink: 0;
        }
        button.play-btn:hover { background: #772ce8; }

        #player-wrapper { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            flex-grow: 1; 
            min-height: 0;
        }

        #player-box { 
            width: 100%; 
            height: 40vh;
            min-height: 200px;
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 6px; 
            overflow: hidden; 
            flex-shrink: 0; 
        }

        iframe, #twitch-embed { width: 100%; height: 100%; border: none; }

        #chat-box { 
            width: 100%; 
            flex-grow: 1; 
            background: #181818; /* YouTube dark theme color */
            border-radius: 6px; 
            overflow: hidden; 
            border: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
            min-height: 250px;
        }
        #chat-box iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            /* Hapus filter invert dan ganti dengan tema gelap jika didukung */
        }
        .chat-placeholder { color: #aaa; font-size: 13px; display: flex; align-items: center; justify-content: center; height: 100%; }

        /* Gaya default untuk mode potrait (bukan fullscreen) */
        #player-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        #player-box {
            width: 100%;
            height: 40%; /* Video diperkecil jadi 40% */
        }
        #chat-box {
            width: 100%;
            height: 60%; /* Kolom komentar diperlebar jadi 60% */
            background-color: #242424; /* Warna lebih terang dari hitam pekat (dark gray) */
            border-top: 1px solid #333;
        }

        /* Class untuk mode fullscreen landscape */
        body.fullscreen-landscape {
            flex-direction: row !important;
        }
        body.fullscreen-landscape #player-wrapper {
            flex-direction: row !important;
            height: 100% !important;
            width: 100% !important;
        }
        body.fullscreen-landscape #player-box {
            height: 100% !important;
            width: 70% !important;
            flex-shrink: 0;
        }
        body.fullscreen-landscape #chat-box {
            width: 30% !important;
            height: 100% !important;
            background-color: #242424;
            display: flex !important;
        }

        /* Modal Playlist Styles */
        #playlist-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e1e; width: 90%; max-width: 400px; border-radius: 8px; padding: 15px; text-align: left; border: 1px solid #444; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .playlist-item { padding: 10px; background: #2a2a2a; margin-bottom: 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .playlist-item:hover { background: #3a3a3a; }
        .playlist-title { font-size: 14px; font-weight: bold; }
        .playlist-type { font-size: 11px; background: #9146FF; padding: 2px 6px; border-radius: 3px; }

        /* Sleep Mode Styles */
        #sleep-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #777;
        }
        body.sleep-active #sleep-overlay {
            display: flex;
        }
        .sleep-timer-btn {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 4px;
            font-size: 13px;
        }
        .sleep-timer-btn:hover { background: #3a3a3a; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="playlist-btn" onclick="openPlaylist()">≡ List</button>
        <input type="text" id="streamInput" placeholder="URL / Channel">
        <button class="play-btn" onclick="detectAndPlay()">Putar</button>
    </div>

    <div class="top-bar" style="justify-content: flex-end;">
        <button class="playlist-btn" id="sleepBtn" onclick="openSleepModal()" title="Sleep Timer">🌙 Sleep</button>
    </div>

    <div id="player-wrapper">
        <div id="player-box">
            <span style="color: #777; font-size: 13px;">Masukkan URL atau Channel</span>
        </div>
        <div id="chat-box">
            <div class="chat-placeholder">Kolom Live Chat / Komentar</div>
        </div>
    </div>

    <!-- Modal Playlist -->
    <div id="playlist-modal" onclick="closePlaylistOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h4 style="margin: 0;">Daftar Playlist</h4>
                <button class="close-btn" onclick="closePlaylist()">✕</button>
            </div>
            <div id="playlist-container">
                <p style="color: #888; text-align: center;">Memuat playlist...</p>
            </div>
        </div>
    </div>

    <!-- Sleep Mode Overlay / Screen off simulator -->
    <div id="sleep-overlay" onclick="cancelSleepMode()">
        <div style="font-size: 32px; margin-bottom: 10px;">🌙</div>
        <div style="font-size: 14px; font-family: monospace;">Sleep Timer Aktif</div>
        <div style="font-size: 11px; color: #444; margin-top: 5px;">Sentuh layar untuk batal & bangunkan</div>
    </div>

    <!-- Modal Sleep Timer -->
    <div id="sleep-modal" onclick="closeSleepModalOutside(event)" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content" style="text-align: center;">
            <div class="modal-header">
                <h4 style="margin: 0;">Pengatur Waktu Tidur (Sleep Timer)</h4>
                <button class="close-btn" onclick="closeSleepModal()">✕</button>
            </div>
            <div id="sleep-status-info" style="margin: 15px 0; font-size: 13px; color: #aaa;">
                Status: <span id="timerStatusText" style="color: #9146FF; font-weight: bold;">Nonaktif</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 12px;">
                <button class="sleep-timer-btn" onclick="setSleepTimer(10)">10 Menit</button>
                <button class="sleep-timer-btn" onclick="setSleepTimer(15)">15 Menit</button>
                <button class="sleep-timer-btn" onclick="setSleepTimer(30)">30 Menit</button>
                <button class="sleep-timer-btn" onclick="setSleepTimer(45)">45 Menit</button>
                <button class="sleep-timer-btn" onclick="setSleepTimer(60)">60 Menit</button>
            </div>
            
            <div style="display: flex; gap: 6px; margin-bottom: 15px; justify-content: center; align-items: center;">
                <input type="number" id="manualMinutes" placeholder="Menit manual" min="1" max="720" style="background: #1a1a1a; border: 1px solid #444; color: white; padding: 6px 10px; border-radius: 5px; width: 120px; font-size: 13px;">
                <button class="sleep-timer-btn" style="margin: 0;" onclick="setManualSleepTimer()">Atur Manual</button>
            </div>
            <button class="play-btn" style="background: #ff5555; width: 100%;" onclick="cancelSleepTimer()">Matikan Timer</button>
        </div>
    </div>

    <!-- Load streams via Fetch API agar selalu update dari GitHub -->
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <script>
        // Variabel global untuk menampung data stream
        let myStreams = [];

        // Fungsi untuk mengambil data dari GitHub
        async function fetchStreams() {
            try {
                const url = 'https://raw.githubusercontent.com/drgx2x/Pemutar_Twitch/main/www/streams.js?t=' + new Date().getTime();
                console.log("Mencoba memuat playlist dari:", url);
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Network response was not ok: ' + response.status);
                }
                
                myStreams = await response.json();
                console.log("Playlist berhasil dimuat!");
            } catch (error) {
                console.error("Gagal memuat playlist:", error);
                myStreams = []; // Fallback jika gagal
            }
        }

        // Jalankan saat aplikasi dibuka
        fetchStreams();

        // Fungsi untuk menampilkan playlist ke modal
        async function loadStreams() {
            let container = document.getElementById('playlist-container');
            if (typeof myStreams === 'undefined' || !myStreams || myStreams.length === 0) {
                container.innerHTML = '<p style="color: #ff5555; text-align: center;">Playlist kosong atau streams.js gagal dimuat.</p>';
                return;
            }

            container.innerHTML = "";
            myStreams.forEach(item => {
                let div = document.createElement('div');
                div.className = 'playlist-item';
                div.innerHTML = `
                    <span class="playlist-title">${item.name}</span>
                    <span class="playlist-type">${(item.type || 'stream').toUpperCase()}</span>
                `;
                div.onclick = () => {
                    document.getElementById('streamInput').value = item.url || item.name;
                    detectAndPlay();
                    closePlaylist();
                };
                container.appendChild(div);
            });
        }

        function openPlaylist() {
            document.getElementById('playlist-modal').style.display = 'flex';
            loadStreams();
        }

        function closePlaylist() {
            document.getElementById('playlist-modal').style.display = 'none';
        }

        function closePlaylistOutside(event) {
            if (event.target.id === 'playlist-modal') {
                closePlaylist();
            }
        }

        let sleepCountdownInterval = null;
        let remainingSeconds = 0;

        function openSleepModal() {
            document.getElementById('sleep-modal').style.display = 'flex';
            updateTimerStatusDisplay();
        }

        function closeSleepModal() {
            document.getElementById('sleep-modal').style.display = 'none';
        }

        function closeSleepModalOutside(event) {
            if (event.target.id === 'sleep-modal') {
                closeSleepModal();
            }
        }

        function setSleepTimer(minutes) {
            cancelSleepTimer();
            remainingSeconds = minutes * 60;
            
            let statusText = document.getElementById('timerStatusText');
            statusText.innerText = `Aktif (${minutes} menit)`;

            sleepCountdownInterval = setInterval(() => {
                remainingSeconds--;
                let m = Math.floor(remainingSeconds / 60);
                let s = remainingSeconds % 60;
                statusText.innerText = `Aktif (${m}m ${s}s lagi)`;

                if (remainingSeconds <= 0) {
                    clearInterval(sleepCountdownInterval);
                    triggerSleepAction();
                }
            }, 1000);

            closeSleepModal();
        }

        function setManualSleepTimer() {
            let minutes = parseInt(document.getElementById('manualMinutes').value);
            if (minutes && minutes > 0) {
                setSleepTimer(minutes);
            } else {
                alert('Masukkan jumlah menit yang valid!');
            }
        }

        function cancelSleepTimer() {
            if (sleepCountdownInterval) clearInterval(sleepCountdownInterval);
            sleepCountdownInterval = null;
            remainingSeconds = 0;
            document.getElementById('timerStatusText').innerText = 'Nonaktif';
        }

        function updateTimerStatusDisplay() {
            let statusText = document.getElementById('timerStatusText');
            if (!sleepCountdownInterval) {
                statusText.innerText = 'Nonaktif';
            }
        }

        function triggerSleepAction() {
            document.getElementById('player-box').innerHTML = '<span style="color: #555; font-size: 13px;">Sleep Timer Berhenti. Pemutaran dihentikan.</span>';
            document.getElementById('chat-box').innerHTML = '<div class="chat-placeholder">Kolom Live Chat / Komentar</div>';
            document.body.classList.add('sleep-active');
        }

        function cancelSleepMode() {
            document.body.classList.remove('sleep-active');
            cancelSleepTimer();
        }

        // Deteksi perubahan fullscreen untuk layout landscape & menyembunyikan StatusBar/System Bars
        document.addEventListener("fullscreenchange", async function() {
            try {
                const ScreenOrientation = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.ScreenOrientation;
                const StatusBar = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar;

                if (document.fullscreenElement) {
                    // Tambahkan class layout landscape
                    document.body.classList.add('fullscreen-landscape');
                    
                    // Sembunyikan status bar / system bars di Android/iOS
                    if (StatusBar) {
                        await StatusBar.hide();
                    }
                    
                    // Paksa layar berputar ke landscape (Capacitor & Web API fallback)
                    if (ScreenOrientation) {
                        await ScreenOrientation.lock({ orientation: 'landscape' });
                    } else if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock("landscape");
                    }
                } else {
                    // Hapus class layout landscape
                    document.body.classList.remove('fullscreen-landscape');
                    
                    // Tampilkan kembali status bar
                    if (StatusBar) {
                        await StatusBar.show();
                    }
                    
                    // Buka kunci orientasi
                    if (ScreenOrientation) {
                        await ScreenOrientation.unlock();
                    } else if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                }
            } catch (err) {
                console.log("Fullscreen change handler error:", err);
            }
        });

        function detectAndPlay() {
            let input = document.getElementById('streamInput').value.trim();
            let playerBox = document.getElementById('player-box');
            let chatBox = document.getElementById('chat-box');
            if (!input) return;

            playerBox.innerHTML = "";
            chatBox.innerHTML = "";
            chatBox.style.display = "flex";

            if (input.includes("youtube.com") || input.includes("youtu.be")) {
                let videoId = "";
                if (input.includes("youtu.be/")) {
                    videoId = input.split("youtu.be/")[1].split("?")[0];
                } else if (input.includes("watch?v=")) {
                    videoId = input.split("watch?v=")[1].split("&")[0];
                } else if (input.includes("embed/")) {
                    videoId = input.split("embed/")[1].split("?")[0];
                }

                if (videoId) {
                    let hostname = window.location.hostname || "localhost";
                    playerBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&theme=dark&color=white" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    chatBox.innerHTML = `<iframe class="youtube-chat" src="https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${hostname}&dark_theme=1"></iframe>`;
                } else {
                    playerBox.innerHTML = `<span style="color: red;">URL YouTube tidak valid</span>`;
                    chatBox.innerHTML = `<div class="chat-placeholder">Chat tidak tersedia</div>`;
                }
            } else {
                let channelName = input;
                if (input.includes("twitch.tv/")) {
                    let parts = input.split("twitch.tv/");
                    channelName = parts[1].split("/")[0];
                }

                let twitchEmbedDiv = document.createElement('div');
                twitchEmbedDiv.id = 'twitch-embed';
                playerBox.appendChild(twitchEmbedDiv);

                new Twitch.Embed("twitch-embed", {
                    width: "100%",
                    height: "100%",
                    channel: channelName,
                    layout: "video",
                    parent: ["localhost", "127.0.0.1", "capacitor.localhost", window.location.hostname]
                });

                // Tampilkan chat box manual untuk Twitch agar seragam
                chatBox.style.display = "flex";
                chatBox.innerHTML = `<iframe src="https://www.twitch.tv/embed/${channelName}/chat?parent=${window.location.hostname}&darkpopout" style="width:100%; height:100%;"></iframe>`;
            }
        }
    </script>
</body>
</html>
